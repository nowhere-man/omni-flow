name: Build Multiplatform

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify shared logic, migrations, and Android lint
        run: ./gradlew :shared:jvmTest :shared:verifySqlDelightMigration :androidApp:lintRelease --stacktrace

      - name: Decode Android keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/omniflow-release.keystore"
          test -s "$RUNNER_TEMP/omniflow-release.keystore"

      - name: Build signed arm64-v8a release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :shared:compileKotlinJvm :androidApp:assembleRelease --stacktrace \
            -PandroidArm64Only=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/omniflow-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find androidApp/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK"
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp "$APK" "dist/OmniFlow-Android-arm64-v8a-${VERSION}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: OmniFlow-Android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Tag Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/**/*.apk
