name: Build Android

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: Android version, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve Android version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Release tag must use v<semver>: $GITHUB_REF_NAME"
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${REQUESTED_VERSION#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Version must use v<semver> or <semver>: $VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify core logic, migrations, and Android lint
        run: ./gradlew :core:testDebugUnitTest :core:verifySqlDelightMigration :app:lintRelease -PversionName="$APP_VERSION" --stacktrace

      - name: Decode Android keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/omniflow-release.keystore"
          test -s "$RUNNER_TEMP/omniflow-release.keystore"

      - name: Build signed arm64-v8a release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="$APP_VERSION" \
            -PandroidArm64Only=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/omniflow-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "dist/OmniFlow-Android-arm64-v8a-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: OmniFlow-Android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Tag Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/**/*.apk
